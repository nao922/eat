<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROUTE GOURMET · 道すがらグルメ</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Development) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel (In-browser JSX compilation) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCreItoOPEfB6lBo5RZpc6oTNQx4XPAWl4&libraries=places"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0E1420;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const INK_BG = "#0E1420";
    const ROUTE_COLOR = "#FFB454";
    const START_COLOR = "#6FE3D0";
    const DEST_COLOR = "#FF6B6B";
    const PAPER = "#F6F3EC";
    const TEXT_INK = "#1B1F27";

    const GENRES = ["和食", "洋食", "イタリアン", "中華"];
    const GENRE_COLORS = {
      和食: "#E2572B",
      洋食: "#4A90D9",
      イタリアン: "#4FA876",
      中華: "#EFB01F",
      その他: "#8E8E93",
    };

    const CHAIN_KEYWORDS = [
      "マクドナルド", "ガスト", "サイゼリヤ", "大戸屋", "やよい軒", "吉野家",
      "松屋", "すき家", "ジョナサン", "ロイヤルホスト", "びっくりドンキー",
      "餃子の王将", "バーミヤン", "日高屋", "リンガーハット", "ココイチ", "鳥貴族",
      "かっぱ寿司", "スシロー", "くら寿司", "はま寿司", "ジョリーパスタ", "カプリチョーザ"
    ];

    const SUGGESTIONS = ["東京駅", "渋谷駅", "新宿駅", "横浜駅", "京都駅"];

    const MAP_STYLES = [
      { elementType: "geometry", stylers: [{ color: "#1d2c4d" }] },
      { elementType: "labels.text.fill", stylers: [{ color: "#8ec3b9" }] },
      { elementType: "labels.text.stroke", stylers: [{ color: "#1a3646" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#0e1626" }] }
    ];

    function computeDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function detectGenre(place) {
      const name = place.name || "";
      const types = place.types || [];

      if (name.includes("和") || name.includes("寿司") || name.includes("割烹") || name.includes("そば") || name.includes("うどん")) return "和食";
      if (name.includes("イタリアン") || name.includes("パスタ") || name.includes("ピザ")) return "イタリアン";
      if (name.includes("中華") || name.includes("餃子") || name.includes("ラーメン")) return "中華";
      if (name.includes("洋食") || name.includes("ステーキ") || name.includes("ハンバーグ") || name.includes("カフェ")) return "洋食";
      
      return GENRES[Math.floor(Math.abs(hashStr(name)) % GENRES.length)];
    }

    function isChainStore(name) {
      return CHAIN_KEYWORDS.some((kw) => name.includes(kw));
    }

    function hashStr(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) {
        h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
      }
      return h;
    }

    function RouteGourmetFinder() {
      const [inputValue, setInputValue] = useState("");
      const [destinationText, setDestinationText] = useState("");
      const [currentLocation, setCurrentLocation] = useState({ lat: 35.681236, lng: 139.767125 });
      const [loading, setLoading] = useState(false);
      const [routeInfo, setRouteInfo] = useState(null);
      const [restaurants, setRestaurants] = useState([]);

      const [distanceFilter, setDistanceFilter] = useState(null);
      const [minRating, setMinRating] = useState(null);
      const [genreSet, setGenreSet] = useState(new Set(GENRES));
      const [chainFilter, setChainFilter] = useState("all");

      const [selected, setSelected] = useState(null);
      const [sheetOpen, setSheetOpen] = useState(false);

      const mapRef = useRef(null);
      const mapContainerRef = useRef(null);
      const markersRef = useRef([]);
      const polylineRef = useRef(null);

      // Map Initialization
      useEffect(() => {
        if (!mapContainerRef.current || mapRef.current) return;

        const map = new google.maps.Map(mapContainerRef.current, {
          center: currentLocation,
          zoom: 14,
          styles: MAP_STYLES,
          disableDefaultUI: true,
          zoomControl: true,
        });

        mapRef.current = map;

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition((pos) => {
            const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setCurrentLocation(loc);
            map.setCenter(loc);
          });
        }
      }, []);

      const handleSearch = async (text) => {
        const query = text.trim();
        if (!query || !mapRef.current) return;

        setLoading(true);
        setDestinationText(query);
        setInputValue(query);
        setSelected(null);
        setSheetOpen(false);

        try {
          const directionsService = new google.maps.DirectionsService();
          const result = await new Promise((resolve, reject) => {
            directionsService.route({
              origin: currentLocation,
              destination: query,
              travelMode: google.maps.TravelMode.WALKING,
            }, (res, status) => status === "OK" ? resolve(res) : reject(status));
          });

          const route = result.routes[0];
          const leg = route.legs[0];
          const pathPoints = route.overview_path.map(pt => ({ lat: pt.lat(), lng: pt.lng() }));

          const km = leg.distance ? leg.distance.value / 1000 : 1.0;
          const walkMin = leg.duration ? Math.round(leg.duration.value / 60) : 15;

          setRouteInfo({
            path: pathPoints,
            km,
            walkMin,
            destLoc: { lat: leg.end_location.lat(), lng: leg.end_location.lng() }
          });

          const bounds = new google.maps.LatLngBounds();
          pathPoints.forEach((p) => bounds.extend(p));
          mapRef.current.fitBounds(bounds, 60);

          if (polylineRef.current) polylineRef.current.setMap(null);
          polylineRef.current = new google.maps.Polyline({
            path: pathPoints,
            strokeColor: ROUTE_COLOR,
            strokeOpacity: 0.95,
            strokeWeight: 5,
            map: mapRef.current,
          });

          const placesService = new google.maps.places.PlacesService(mapRef.current);
          const sampleCount = Math.min(6, Math.max(2, Math.floor(pathPoints.length / 10)));
          const sampledPoints = [];
          for (let i = 0; i < sampleCount; i++) {
            const idx = Math.floor((i / (sampleCount - 1)) * (pathPoints.length - 1));
            sampledPoints.push(pathPoints[idx]);
          }

          const fetchedPlacesMap = new Map();

          for (const pt of sampledPoints) {
            const placesResult = await new Promise((resolve) => {
              placesService.nearbySearch({
                location: pt,
                radius: 400,
                type: "restaurant",
              }, (res, status) => resolve(status === google.maps.places.PlacesServiceStatus.OK ? res : []));
            });

            placesResult.forEach((place) => {
              if (!fetchedPlacesMap.has(place.place_id) && place.geometry) {
                let minDistanceKm = Infinity;
                pathPoints.forEach((routePt) => {
                  const dist = computeDistanceKm(
                    place.geometry.location.lat(),
                    place.geometry.location.lng(),
                    routePt.lat,
                    routePt.lng
                  );
                  if (dist < minDistanceKm) minDistanceKm = dist;
                });

                fetchedPlacesMap.set(place.place_id, {
                  id: place.place_id,
                  name: place.name,
                  genre: detectGenre(place),
                  isChain: isChainStore(place.name || ""),
                  rating: place.rating || 3.5,
                  reviewCount: place.user_ratings_total || 10,
                  walkMinutes: Math.max(1, Math.round(minDistanceKm * 15)),
                  pos: { lat: place.geometry.location.lat(), lng: place.geometry.location.lng() },
                  address: place.vicinity || "住所情報なし",
                });
              }
            });
          }

          setRestaurants(Array.from(fetchedPlacesMap.values()));
        } catch (err) {
          alert("ルート検索に失敗しました。目的地をご確認ください。");
        } finally {
          setLoading(false);
        }
      };

      const filtered = useMemo(() => {
        return restaurants.filter((r) => {
          if (distanceFilter && r.walkMinutes > distanceFilter) return false;
          if (minRating && r.rating < minRating) return false;
          if (!genreSet.has(r.genre)) return false;
          if (chainFilter === "chain" && !r.isChain) return false;
          if (chainFilter === "non-chain" && r.isChain) return false;
          return true;
        });
      }, [restaurants, distanceFilter, minRating, genreSet, chainFilter]);

      useEffect(() => {
        markersRef.current.forEach(m => m.setMap(null));
        markersRef.current = [];

        if (!mapRef.current) return;

        filtered.forEach(r => {
          const isSel = selected && selected.id === r.id;
          const marker = new google.maps.Marker({
            position: r.pos,
            map: mapRef.current,
            icon: {
              path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z",
              scale: isSel ? 1.8 : 1.3,
              fillColor: GENRE_COLORS[r.genre] || "#8E8E93",
              fillOpacity: 1,
              strokeColor: isSel ? "#FFFFFF" : "#0E1420",
              strokeWeight: isSel ? 2 : 1,
              anchor: new google.maps.Point(12, 22),
            }
          });

          marker.addListener("click", () => {
            setSelected(r);
            setSheetOpen(true);
          });

          markersRef.current.push(marker);
        });
      }, [filtered, selected]);

      return (
        <div className="w-full flex flex-col h-screen max-h-[900px] overflow-hidden text-white font-sans">
          {/* Header */}
          <div className="p-3 bg-slate-900 z-10">
            <div className="text-[11px] tracking-widest text-slate-400 font-semibold mb-1">
              ROUTE GOURMET · 道すがらグルメ
            </div>
            <div className="flex items-center gap-2">
              <div className="flex items-center flex-1 gap-2 rounded-2xl px-3 bg-white/10 h-11">
                <input
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && handleSearch(inputValue)}
                  placeholder="目的地を入力（例：渋谷駅、東京タワー）"
                  className="flex-1 bg-transparent outline-none text-sm text-white placeholder-gray-400"
                />
              </div>
              <button
                onClick={() => handleSearch(inputValue)}
                disabled={loading}
                className="flex items-center justify-center rounded-2xl w-11 h-11 bg-[#FFB454] text-slate-900 font-bold"
              >
                {loading ? "..." : "検索"}
              </button>
            </div>
            {routeInfo && (
              <div className="text-xs text-slate-400 mt-2">
                現在地 → {destinationText} （約{routeInfo.km.toFixed(1)}km・徒歩{routeInfo.walkMin}分）
              </div>
            )}
          </div>

          {/* Map Area */}
          <div className="relative flex-1 w-full h-full">
            <div ref={mapContainerRef} className="w-full h-full" />

            {!routeInfo && !loading && (
              <div className="absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-950/50 backdrop-blur-xs pointer-events-none">
                <div className="text-slate-300 text-sm mb-3">目的地を入力するとルートと周辺グルメを表示します</div>
                <div className="flex flex-wrap gap-2 justify-center pointer-events-auto">
                  {SUGGESTIONS.map((s) => (
                    <button
                      key={s}
                      onClick={() => handleSearch(s)}
                      className="px-3 py-1.5 rounded-full text-xs bg-white/10 text-white hover:bg-white/20"
                    >
                      {s}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {routeInfo && (
              <div className="absolute bottom-3 left-3 bg-slate-900/90 text-white text-xs px-3 py-1.5 rounded-full">
                {filtered.length} 件表示中
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RouteGourmetFinder />);
  </script>
</body>
</html>
